<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symptom Checker</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #111; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #555; margin-top: 0; }
  input[type=text] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #999; border-radius: 4px; box-sizing: border-box; }
  #list { height: 240px; overflow-y: auto; border: 1px solid #999; border-radius: 4px; margin-top: 8px; padding: 6px; }
  .item { display: block; padding: 8px 4px; font-size: 15px; cursor: pointer; border-bottom: 1px solid #eee; }
  .item input { margin-right: 8px; transform: scale(1.2); }
  #chosen { margin-top: 10px; font-size: 14px; min-height: 20px; }
  .chip { display: inline-block; background: #111; color: #fff; padding: 4px 10px; border-radius: 14px; margin: 3px 4px 3px 0; font-size: 13px; }
  button { margin-top: 14px; width: 100%; padding: 12px; font-size: 16px; background: #111; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  button.secondary { background: #fff; color: #111; border: 1px solid #111; margin-top: 8px; }
  #error { margin-top: 14px; color: #b00020; display: none; }
  .card { margin-top: 18px; padding: 14px; border: 2px solid #111; border-radius: 4px; }
  .card h2 { margin: 0 0 4px 0; font-size: 18px; }
  .prob { font-size: 14px; color: #444; margin-bottom: 8px; }
  .card ul { margin: 6px 0 0 18px; padding: 0; }
  #severity { margin-top: 18px; font-size: 14px; }
  .note { margin-top: 28px; font-size: 12px; color: #555; border-top: 1px solid #ccc; padding-top: 10px; }
</style>
</head>
<body>

<h1>Symptom Checker</h1>
<p class="sub">Select the symptoms you have (at least 2, ideally 3 or more), then press Check.</p>

<input id="search" type="text" placeholder="Search symptoms, e.g. fever">
<div id="list">Loading symptoms...</div>
<div id="chosen"></div>

<button onclick="predict()">Check</button>
<button class="secondary" onclick="clearAll()">Clear all</button>

<div id="error"></div>
<div id="severity"></div>
<div id="results"></div>

<p class="note" id="disclaimer">
  Educational project using a public dataset. This is not medical advice and
  cannot diagnose any condition. Please consult a doctor.
</p>

<script>
let allSymptoms = [];
const selected = new Set();

function pretty(name) { return name.replace(/_/g, " "); }

async function load() {
  try {
    const res = await fetch("/symptoms");
    const data = await res.json();
    allSymptoms = data.symptoms;
    render();
  } catch (e) {
    document.getElementById("list").textContent = "Could not load symptoms. Is the server running?";
  }
}

function render() {
  const query = document.getElementById("search").value.toLowerCase().trim();
  const list = document.getElementById("list");
  list.innerHTML = "";
  allSymptoms
    .filter(s => pretty(s).includes(query))
    .forEach(s => {
      const label = document.createElement("label");
      label.className = "item";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = selected.has(s);
      box.onchange = () => {
        if (box.checked) selected.add(s); else selected.delete(s);
        renderChosen();
      };
      label.appendChild(box);
      label.appendChild(document.createTextNode(pretty(s)));
      list.appendChild(label);
    });
  renderChosen();
}

function renderChosen() {
  const box = document.getElementById("chosen");
  box.innerHTML = "";
  if (selected.size === 0) { box.textContent = "No symptoms selected yet."; return; }
  selected.forEach(s => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = pretty(s);
    box.appendChild(chip);
  });
}

function clearAll() {
  selected.clear();
  document.getElementById("results").innerHTML = "";
  document.getElementById("severity").textContent = "";
  document.getElementById("error").style.display = "none";
  render();
}

function showError(msg) {
  const e = document.getElementById("error");
  e.textContent = msg;
  e.style.display = "block";
}

async function predict() {
  document.getElementById("error").style.display = "none";
  document.getElementById("results").innerHTML = "";
  document.getElementById("severity").textContent = "";

  if (selected.size < 2) { showError("Please select at least 2 symptoms."); return; }

  try {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symptoms: Array.from(selected) })
    });
    if (!res.ok) { showError("Something went wrong. Please try again."); return; }
    const data = await res.json();

    document.getElementById("severity").textContent =
      "Symptom severity score: " + data.severity_score +
      " (the sum of severity weights; higher means more severe symptoms).";

    const results = document.getElementById("results");
    data.predictions.forEach((p, i) => {
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h2");
      title.textContent = (i + 1) + ". " + p.disease;
      card.appendChild(title);

      const prob = document.createElement("div");
      prob.className = "prob";
      prob.textContent = "Match: " + Math.round(p.probability * 100) + "%";
      card.appendChild(prob);

      const desc = document.createElement("p");
      desc.textContent = p.description;
      card.appendChild(desc);

      if (p.precautions.length) {
        const head = document.createElement("strong");
        head.textContent = "Suggested precautions:";
        card.appendChild(head);
        const ul = document.createElement("ul");
        p.precautions.forEach(t => {
          const li = document.createElement("li");
          li.textContent = t;
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }
      results.appendChild(card);
    });
  } catch (e) {
    showError("Could not reach the server. Is it running?");
  }
}

document.getElementById("search").addEventListener("input", render);
load();
</script>
</body>
</html>
